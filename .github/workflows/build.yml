name: Build Cross-Platform Executables

on:
  push:
    tags:
      - 'v*' # Triggers automatically when you push a tag starting with 'v' (e.g., v1.0.0)

jobs:
  build:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            asset_name: EEG_Annotator-Windows.zip
            run_build: |
              pyinstaller --noconfirm --onedir --windowed --name "EEG_Annotator" --collect-all mne --collect-all mne_qt_browser --collect-all pyedflib app.py
              powershell Compress-Archive -Path "dist/EEG_Annotator" -DestinationPath "EEG_Annotator-Windows.zip"

          - os: macos-latest
            asset_name: EEG_Annotator-macOS.zip
            run_build: |
              pyinstaller --noconfirm --onedir --windowed --name "EEG_Annotator" --collect-all mne --collect-all mne_qt_browser --collect-all pyedflib app.py
              ditto -c -k --sequesterRsrc --keepParent "dist/EEG_Annotator.app" EEG_Annotator-macOS.zip

          - os: ubuntu-latest
            asset_name: EEG_Annotator-Linux.tar.gz
            run_build: |
              pyinstaller --noconfirm --onedir --windowed --name "EEG_Annotator" --collect-all mne --collect-all mne_qt_browser --collect-all pyedflib app.py
              tar -czvf EEG_Annotator-Linux.tar.gz -C dist EEG_Annotator

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install System Dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libxcb-cursor0 libxkbcommon-x11-0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 libxcb-shape0 libgl1-mesa-glx

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build Executable Package
        run: ${{ matrix.run_build }}

      - name: Upload to Release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.asset_name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}